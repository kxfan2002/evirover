# ============================================================================
# EviRover SFT: Qwen3-VL-4B-Instruct, full fine-tune with a frozen vision tower
# ============================================================================
# This is the configuration used to produce the SFT checkpoint that the RL stage
# starts from. Paths below are placeholders -- see README.md for what to put
# where. Hyperparameters are the ones that were actually used; change them and
# you are no longer reproducing the released checkpoint.
# ============================================================================

### model
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
image_max_pixels: 2160000        # ~p90 of the training images, so most are not downscaled
image_min_pixels: 1024           # do not upscale small images or crop sub-images
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true             # vision encoder stays at its pretrained weights
freeze_multi_modal_projector: false   # the projector is the only trainable vision-side module
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: evirover_sft                  # must match the key in data/dataset_info.json
media_dir: /path/to/sft_data           # root that the "images" paths in the data are relative to
template: qwen3_vl                     # Qwen3-VL reasoning template, so the chain of thought is learned
preserve_thinking: true                # multi-turn agent data: keep <think> on earlier turns too
enable_thinking: true                  # keep <think> on the final turn
cutoff_len: 24576
# Use a tokenized_path that is unique to this dataset. The preprocessed cache is
# keyed by this path only, not by the dataset contents, so reusing another run's
# path together with overwrite_cache: false silently trains on the older data.
tokenized_path: ./cache/tokenized/evirover_sft
overwrite_cache: false
preprocessing_num_workers: 96
dataloader_num_workers: 4

### output
output_dir: ./output/evirover_sft_qwen3vl_4b
logging_steps: 5
save_steps: 30
plot_loss: true
overwrite_output_dir: true
save_total_limit: 15
report_to: none                        # set to wandb/swanlab and add run_name to log a run

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8         # effective batch = 1 * 8 * 8 GPUs = 64
learning_rate: 5.0e-6
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
flash_attn: fa2
# Fused linear cross-entropy: the backward pass never materializes the full
# logit gradient (seq 24576 x vocab ~152K). Requires the qwen3_vl branch in
# src/llamafactory/model/model_utils/liger_kernel.py, which is already applied
# in this tree -- without it the flag silently does nothing and training OOMs.
enable_liger_kernel: true
